<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Haven Vertex — Connect. Automate. Elevate.</title>
  <meta name="description" content="Haven Vertex is a digital partner offering website management, SEO, content, and virtual assistance — your way, human-led or AI-enhanced." />

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/animations.css" />

  <noscript><style>.hero[data-hero="landing"]{opacity:1 !important;}</style></noscript>
</head>
<body>
  <main class="portal-page">
    <section class="hero" data-hero="landing">
      <div class="hero-noise"></div>
      <div class="hero-glow-boost hero-glow-boost--human"></div>
      <div class="hero-glow-boost hero-glow-boost--ai"></div>
      <div class="hero-particles"></div>

      <div class="hero-visual">
        <img class="hero-logo" src="/assets/logo/globe-keyhole.png" alt="Haven Vertex — globe and keyhole mark" width="220" height="190" />
        <h1 class="hero-wordmark">HAVEN<span>VERTEX</span></h1>
      </div>

      <p class="hero-tagline">Connect. Automate. Elevate.</p>
      <div class="hero-divider"></div>

      <h2 class="hero-headline">How would you like to work with us?</h2>
      <p class="hero-subline">Same expertise. Same services. Your preferred way of working.</p>

      <div class="portal-grid">
        <a href="/human.html" data-href="/human.html" class="portal-card portal-card--human" tabindex="0">
          <span class="portal-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </span>
          <h3 class="portal-title">Human-First</h3>
          <p class="portal-text">Human-led. Personally handled.</p>
          <span class="portal-enter">Enter
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </span>
        </a>

        <div class="portal-divider">OR</div>

        <a href="/ai.html" data-href="/ai.html" class="portal-card portal-card--ai" tabindex="0">
          <span class="portal-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l1.8 4.6L18 8l-4.2 1.4L12 14l-1.8-4.6L6 8l4.2-1.4L12 2z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z"/><path d="M5 14l.7 1.6L7 16l-1.3.4L5 18l-.7-1.6L3 16l1.3-.4L5 14z"/></svg>
          </span>
          <h3 class="portal-title">AI-Enabled</h3>
          <p class="portal-text">Human-led. Technology-enhanced.</p>
          <span class="portal-enter">Enter
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </span>
        </a>
      </div>

      <p class="hero-scroll-hint">Choose a path to enter</p>
    </section>
  </main>

  <div class="page-transition" aria-hidden="true">
    <img class="page-transition-mark" src="/assets/icons/icon-192.png" alt="" />
  </div>

  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/animations.js"></script>
  <script type="module" src="/js/portal.js"></script>
</body>
</html>
